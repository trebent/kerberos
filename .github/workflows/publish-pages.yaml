name: Deploy to GitHub Pages

# GitHub Pages serves the gh-pages branch. This workflow publishes the live site to its root;
# pull-request-pages.yaml publishes pull request previews under pr-preview/.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pages/**"
      - "openapi/**"
      - ".github/workflows/callable-pages.yaml"
      - ".github/workflows/publish-pages.yaml"

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Never deploy something that would fail the pull request checks.
  check:
    uses: ./.github/workflows/callable-pages.yaml

  deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: api-pages
      url: https://trebent.github.io/kerberos/
    defaults:
      run:
        working-directory: pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pages/package-lock.json

      - run: make install

      - name: Build for GitHub Pages
        run: make build/pages BASE_HREF=/kerberos/

      - name: Publish to the gh-pages branch
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: pages/dist/kerberos-pages/browser
          branch: gh-pages
          # Keep the pull request previews, and rebase onto them rather than force-push.
          clean-exclude: pr-preview/
          force: false
          commit-message: "Deploy the site from ${{ github.sha }}"
