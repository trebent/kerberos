global:
  scrape_interval: 15s

scrape_configs:
  - job_name: kerberos
    static_configs:
      - targets: ["kerberos:9464"]
  - job_name: jaeger
    static_configs:
      - targets: ["jaeger:8888"]
  - job_name: echo
    static_configs:
      - targets: ["echo:9464"]
  - job_name: api
    static_configs:
      - targets: ["api:9464"]
  - job_name: connector
    static_configs:
      - targets: ["connector:9464"]
