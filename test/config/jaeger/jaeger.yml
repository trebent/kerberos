service:
  extensions: [jaeger_storage, jaeger_query]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    resource:
      service.name: jaeger
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
    logs:
      level: info
    # TODO Initialize telemetry tracer once OTEL released new feature.
    # https://github.com/open-telemetry/opentelemetry-collector/issues/10663

extensions:
  jaeger_query:
    storage:
      traces: badger_store
      traces_archive: badger_archive
    ui:
      config_file: /config-ui.json
    http:
      endpoint: 0.0.0.0:16686
      # To enable TLS:
      # tls:
      #   cert_file: /certs/server.crt
      #   key_file: /certs/server.key
    # This port is used by tests and does not need to be exposed to the host. It is used for internal communication between the query service and the storage extension.
    grpc:
      endpoint: 0.0.0.0:16685
  jaeger_storage:
    backends:
      badger_store:
        badger:
          directories:
            keys: "/jaeger/"
            values: "/jaeger/"
          ephemeral: false
          ttl:
            spans: 48h # 2 days
          metrics_update_interval: 10s
      badger_archive:
        badger:
          directories:
            keys: "/jaeger/archive/"
            values: "/jaeger/archive/"
          ephemeral: false
          ttl:
            spans: 72h # 3 days
          metrics_update_interval: 10s

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"

processors:
  batch:

exporters:
  jaeger_storage_exporter:
    trace_storage: badger_store
