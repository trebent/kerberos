<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <title>Kerberos API gateway</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Kerberos is a self-hosted API gateway. Quick start, request flow and the OpenAPI reference for the gateway, Admin API and basic-auth API."
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=block"
      rel="stylesheet"
    />
    <script>
      // GitHub Pages answers every unknown path with the live site's 404.html, even paths inside
      // a pull request preview (pr-preview/pr-<n>/, which has its own base href). Send such a
      // deep link to its preview, which then restores the path before Angular starts.
      (function () {
        var key = 'kerberos.previewPath';
        var base = new URL(document.baseURI).pathname;
        var preview = /^.*?\/pr-preview\/pr-\d+\//.exec(location.pathname);
        if (preview && preview[0] !== base && preview[0] !== location.pathname) {
          try {
            sessionStorage.setItem(key, location.pathname + location.search + location.hash);
          } catch (e) {
            // Storage unavailable: the preview opens at its start page.
          }
          location.replace(preview[0]);
          return;
        }
        try {
          var saved = sessionStorage.getItem(key);
          sessionStorage.removeItem(key);
          if (saved && saved.indexOf(base) === 0) history.replaceState(null, '', saved);
        } catch (e) {
          // Storage unavailable: nothing to restore.
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
