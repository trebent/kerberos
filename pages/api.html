<!DOCTYPE html>
<html lang="en-GB">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kerberos API reference</title>
  <meta name="description" content="OpenAPI reference for the Kerberos gateway, Admin API and basic-auth API." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐶</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/redoc@2.5.4/bundles/redoc.standalone.js"></script>
</head>

<body class="api-page">
  <header class="topbar">
    <div class="wrap wrap-full">
      <a class="brand" href="./"><span class="dogs" aria-hidden="true">🐶🐶🐶</span><span class="name">Kerberos</span></a>
      <div class="api-tabs" role="tablist" aria-label="API">
        <button role="tab" data-api="gateway">Gateway<span class="port">:30000</span></button>
        <button role="tab" data-api="admin">Admin<span class="port">:30001</span></button>
        <button role="tab" data-api="auth">Basic auth<span class="port">:30001</span></button>
      </div>
      <nav class="nav" aria-label="Main">
        <a class="hide-sm" href="https://github.com/trebent/kerberos/blob/main/docs/README.md">Docs</a>
        <a class="gh" href="https://github.com/trebent/kerberos">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
          <span class="hide-sm">GitHub</span>
        </a>
      </nav>
    </div>
  </header>

  <div class="spec-bar">
    <div class="wrap wrap-full">
      <code class="spec-file" id="spec-file">openapi/gateway.yaml</code>
      <div class="view-toggle" role="group" aria-label="View">
        <button type="button" data-view="reference" aria-pressed="true">Reference</button>
        <button type="button" data-view="source" aria-pressed="false">Source</button>
      </div>
      <a class="spec-link" id="spec-download" href="#" download>Download</a>
      <a class="spec-link hide-sm" id="spec-github" href="https://github.com/trebent/kerberos/tree/main/openapi">GitHub</a>
    </div>
  </div>

  <div id="redoc-container"><p class="api-status">Loading API reference…</p></div>
  <div id="source-container" hidden>
    <div class="source-head">
      <span id="source-meta"></span>
      <button class="copy" type="button" id="source-copy">Copy</button>
    </div>
    <pre class="spec-source"><code id="source-code"></code></pre>
  </div>

  <script>
    // The deploy workflow copies openapi/ next to this page. When previewing
    // from a checkout, fall back to the repository's openapi/ directory.
    const apis = {
      gateway: 'gateway.yaml',
      admin: 'admin.yaml',
      auth: 'auth_basic.yaml',
    };
    const views = ['reference', 'source'];
    const barHeight = 104;

    const theme = {
      colors: { primary: { main: '#c2410c' } },
      typography: {
        fontFamily: 'Inter, system-ui, sans-serif',
        headings: { fontFamily: 'Inter, system-ui, sans-serif', fontWeight: '700' },
        code: { fontFamily: '"JetBrains Mono", ui-monospace, monospace', fontSize: '13px' },
      },
      sidebar: { backgroundColor: '#f6f5f2', textColor: '#17181c', activeTextColor: '#c2410c' },
      rightPanel: { backgroundColor: '#14161d' },
      codeBlock: { backgroundColor: '#0b0d12' },
    };

    const state = { api: null, view: null, url: null, text: null };

    async function specUrl(file) {
      for (const base of ['openapi/', '../openapi/']) {
        try {
          const res = await fetch(base + file, { method: 'HEAD' });
          if (res.ok) return base + file;
        } catch { /* try the next location */ }
      }
      return null;
    }

    function escapeHtml(text) {
      return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // Minimal YAML highlighting: comments, keys, quoted strings, $refs and numbers.
    function highlightLine(line) {
      const html = escapeHtml(line);
      const comment = html.match(/^(\s*)(#.*)$/);
      if (comment) return comment[1] + '<span class="c">' + comment[2] + '</span>';
      return html
        .replace(/^(\s*-?\s*)([A-Za-z0-9_$\/{}.\-"']+)(:)(?=\s|$)/, '$1<span class="k">$2</span>$3')
        .replace(/(:\s+|-\s+)("[^"]*"|'[^']*')/g, '$1<span class="s">$2</span>')
        .replace(/(:\s+)(-?\d+(\.\d+)?)\s*$/, '$1<span class="n">$2</span>');
    }

    function renderSource(text) {
      const lines = text.replace(/\n$/, '').split('\n');
      document.getElementById('source-code').innerHTML = lines
        .map((line, i) => '<span class="line" id="L' + (i + 1) + '">' + (highlightLine(line) || ' ') + '</span>')
        .join('');
      document.getElementById('source-meta').textContent =
        apis[state.api] + ' · ' + lines.length + ' lines';
    }

    function setView(view) {
      state.view = views.includes(view) ? view : 'reference';
      document.querySelectorAll('[data-view]').forEach((b) => {
        b.setAttribute('aria-pressed', String(b.dataset.view === state.view));
      });
      document.getElementById('redoc-container').hidden = state.view !== 'reference';
      document.getElementById('source-container').hidden = state.view !== 'source';
      const url = new URL(window.location);
      url.searchParams.set('view', state.view);
      history.replaceState(null, '', url);
    }

    function failed() {
      const message = '<p class="api-status">The specification could not be loaded. The contracts are in the <a href="https://github.com/trebent/kerberos/tree/main/openapi">openapi/ directory</a> on GitHub.</p>';
      document.getElementById('redoc-container').innerHTML = message;
      document.getElementById('source-code').innerHTML = '';
      document.getElementById('source-meta').textContent = 'Not available';
    }

    async function show(name, view) {
      state.api = apis[name] ? name : 'gateway';
      document.querySelectorAll('[data-api]').forEach((tab) => {
        tab.setAttribute('aria-selected', String(tab.dataset.api === state.api));
      });
      const url = new URL(window.location);
      url.searchParams.set('api', state.api);
      history.replaceState(null, '', url);
      setView(view || state.view);

      const file = apis[state.api];
      document.getElementById('spec-file').textContent = 'openapi/' + file;
      document.getElementById('spec-github').href = 'https://github.com/trebent/kerberos/blob/main/openapi/' + file;

      state.url = await specUrl(file);
      if (!state.url) return failed();
      const download = document.getElementById('spec-download');
      download.href = state.url;
      download.setAttribute('download', file);

      try {
        state.text = await (await fetch(state.url)).text();
        renderSource(state.text);
      } catch {
        return failed();
      }

      const container = document.getElementById('redoc-container');
      if (typeof Redoc === 'undefined') {
        container.innerHTML = '<p class="api-status">The interactive reference could not be loaded. Switch to <b>Source</b> to read the specification.</p>';
        return;
      }
      container.innerHTML = '';
      Redoc.init(state.url, { scrollYOffset: barHeight, theme }, container);
      window.scrollTo(0, 0);
    }

    document.querySelectorAll('[data-api]').forEach((tab) => {
      tab.addEventListener('click', () => show(tab.dataset.api));
    });
    document.querySelectorAll('[data-view]').forEach((button) => {
      button.addEventListener('click', () => { setView(button.dataset.view); window.scrollTo(0, 0); });
    });
    document.getElementById('source-copy').addEventListener('click', async (e) => {
      try {
        await navigator.clipboard.writeText(state.text || '');
        e.target.textContent = 'Copied';
      } catch {
        e.target.textContent = 'Copy failed';
      }
      setTimeout(() => { e.target.textContent = 'Copy'; }, 1500);
    });

    const params = new URLSearchParams(window.location.search);
    show(params.get('api'), params.get('view'));
  </script>
</body>

</html>
